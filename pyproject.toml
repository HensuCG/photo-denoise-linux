[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-denoise"
version = "0.1.0"
description = "Local CUDA photo denoising with metadata preservation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "spandrel==0.4.2",
  "numpy>=2,<3", "Pillow>=11,<13", "tifffile>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
photo-denoise = "photo_denoise.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: inference with downloaded official weights"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
